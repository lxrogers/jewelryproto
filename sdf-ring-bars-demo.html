<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ring with Bars SDF Demo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #050505;
      color: #fff;
      overflow: hidden;
    }
    .container {
      width: 100vw;
      height: 100vh;
      position: relative;
    }
    #canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    .loading-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.7);
      z-index: 10;
      font-size: 16px;
      gap: 12px;
    }
    .stats {
      position: absolute;
      left: 12px;
      bottom: 12px;
      font-size: 12px;
      color: #ccc;
      background: rgba(0,0,0,0.5);
      padding: 6px 10px;
      border-radius: 6px;
    }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="container">
    <canvas id="canvas"></canvas>
    <div class="loading-overlay" id="loading">
      <div class="spinner loading-text">Loading SDF...</div>
    </div>
    <div class="stats" id="stats">-</div>
  </div>
  <script type="module" src="/src/sdf-ring-bars-demo.ts"></script>
    <a href="./index.html" style="position:fixed;left:calc(12px + env(safe-area-inset-left, 0px));bottom:calc(12px + env(safe-area-inset-bottom, 0px));z-index:10000;padding:6px 12px;border-radius:99px;background:rgba(20,18,14,.78);color:#f0d68a;font:500 13px/1.4 -apple-system,BlinkMacSystemFont,sans-serif;text-decoration:none;border:1px solid rgba(240,214,138,.35);backdrop-filter:blur(6px)">&larr; All prototypes</a>
</body>
</html>
