<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manifold Ring Designer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #111;
            color: #fff;
            overflow: hidden;
        }

        .container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        #canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        .loading-overlay.hidden {
            display: none;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #333;
            border-top: 4px solid #FFD700;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        .loading-text {
            margin-top: 20px;
            font-size: 16px;
            color: #FFD700;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .info {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 20px;
            border-radius: 10px;
            max-width: 320px;
        }

        .info h1 {
            font-size: 24px;
            margin-bottom: 10px;
            color: #FFD700;
        }

        .info p {
            font-size: 14px;
            line-height: 1.6;
            color: #ccc;
        }

        #stats {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-family: 'Monaco', 'Menlo', monospace;
            color: #FFD700;
        }

        .lil-gui {
            --background-color: rgba(0, 0, 0, 0.85);
            --title-background-color: #1a1a1a;
            --title-text-color: #FFD700;
            --widget-color: #333;
            --hover-color: #444;
            --focus-color: #555;
            --number-color: #FFD700;
            --string-color: #88c0d0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="loading-overlay" id="loading">
            <div class="loading-spinner"></div>
            <div class="loading-text">Initializing...</div>
        </div>

        <div class="info">
            <h1>Manifold Ring Designer</h1>
            <p>
                Parametric ring generator using Manifold-3D for watertight CSG operations.
                Adjust parameters and export to GLB/STL.
            </p>
        </div>

        <div id="stats">Loading...</div>

        <canvas id="canvas"></canvas>
    </div>

    <script type="module" src="/src/manifold-ring-demo.ts"></script>
</body>
</html>
